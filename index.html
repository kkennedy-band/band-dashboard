<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director's Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Header -->
    <header class="header">
        <div class="title-area">
            <h1>🎼 Director's Dashboard</h1>
            <p id="date-display">Loading date...</p>
        </div>

        <div class="clock-area">
            <div id="clock">00:00:00</div>
        </div>
    </header>


    <!-- Countdown Banner -->
    <section class="countdown-container">

        <div id="countdown-title">
            NEXT CLASS
        </div>

        <div id="countdown">
            --:--
        </div>

        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>

    </section>


    <!-- Main Dashboard -->
    <main class="main-content">


        <!-- Schedule Panel -->
        <section class="panel schedule-panel">

            <h2>Today's Schedule</h2>

            <div id="schedule-list">
                Loading schedule...
            </div>

        </section>



        <!-- Agenda Panel -->
        <section class="panel agenda-panel">

            <h2>Daily Agenda</h2>

            <div class="agenda-content">

                <h3>Objectives</h3>
                <p>
                    Add today's objectives here.
                </p>


                <h3>Rehearsal Plan</h3>
                <p>
                    Add rehearsal notes here.
                </p>


                <h3>Reminders</h3>
                <p>
                    Add announcements here.
                </p>

            </div>

        </section>


    </main>



    <!-- Footer -->
    <footer class="footer">

        <div>
            <strong>Current Class:</strong>
            <span id="current-class">
                None
            </span>
        </div>


        <div>
            <strong>Next Class:</strong>
            <span id="next-class">
                None
            </span>
        </div>


    </footer>



</div>


<script src="schedule.js"></script>
<script src="script.js"></script>


</body>
</html>
